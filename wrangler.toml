# Cloudflare Pages configuration.
# This marks the repo as a PAGES project (pages_build_output_dir). Create the
# Cloudflare project via Pages → Connect to Git, not the Workers "import a
# repository" flow. Secrets/bindings are set in the Pages dashboard.
name = "factor42"
pages_build_output_dir = "dist-astro"
compatibility_date = "2024-11-01"

# D1 binding is configured in the Pages dashboard (Settings → Functions → D1
# bindings) as "DB". For local `wrangler pages dev`, uncomment and paste the id
# from `wrangler d1 create factor42-submissions`:
# [[d1_databases]]
# binding = "DB"
# database_name = "factor42-submissions"
# database_id = "PASTE_D1_DATABASE_ID"

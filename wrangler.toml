# Cloudflare Pages configuration.
# Bindings here are used by `wrangler pages dev` (local) and can mirror the
# dashboard bindings. Secrets (Mailjet keys, GitHub App key) are NOT stored here —
# set them in the Pages dashboard (Settings → Environment variables).
name = "factor42"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist-astro"

# D1 database for form submissions. Create it, then paste its id here:
#   wrangler d1 create factor42-submissions
[[d1_databases]]
binding = "DB"
database_name = "factor42-submissions"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
